[package]
name = "aurora"
version = "0.1.0"
edition = "2021"
description = "Decoder-only transformer LM, from-scratch Rust"
license = "MIT OR Apache-2.0"

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
rand = "0.9"
rayon = "1"
wgpu = { version = "23", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
bevy = { version = "0.18", optional = true, default-features = false, features = [
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_log",
    "x11",
    "wayland",
    "default_font",
    "png",
] }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
viz = ["dep:bevy"]

[dev-dependencies]
criterion = "0.5"
indicatif = "0.18"
textplots = "0.8"

[[example]]
name = "aurora_train"
