[package]
name = "aurora"
version = "0.1.0"
edition = "2021"
description = "Biologically-inspired spiking neural network"
license = "MIT OR Apache-2.0"

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
rand = "0.9"
rayon = "1"
wgpu = { version = "23", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
criterion = "0.5"
indicatif = "0.18"
textplots = "0.8"

[[bench]]
name = "sparsity_scaling"
harness = false

[[bench]]
name = "lm_sparse_speedup"
harness = false

[[bench]]
name = "lm_gpu_speedup"
harness = false
required-features = ["gpu"]

[[bench]]
name = "multi_layer_perf"
harness = false

[[example]]
name = "aurora_train"
required-features = ["gpu"]

[[example]]
name = "aurora_lnn_train"
