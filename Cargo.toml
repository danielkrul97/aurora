[package]
name = "aurora"
version = "0.2.0"
edition = "2021"
description = "Biologically-inspired language model on a closed-form continuous-time (CfC) Liquid Neural Network cell"
license = "MIT OR Apache-2.0"

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
rand = "0.9"
rayon = "1"
wgpu = { version = "23", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
indicatif = "0.18"
textplots = "0.8"

[[example]]
name = "aurora_train"

[[example]]
name = "train_bpe"
